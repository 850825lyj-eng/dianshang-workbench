<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>修修图·电商工作台 | 专业的沉浸式一站式图像处理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* ========== 双主题变量（全权接管·色彩重构） ========== */
    :root {
      --bg-main: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-workspace: #E2E8F0;
      --color-primary: #0284C7;
      --color-primary-glow: rgba(2, 132, 199, 0.08);
      --color-text: #0F172A;
      --color-text-secondary: #475569;
      --border-light: #E2E8F0;
      --header-height: 56px;
      --sidebar-width: 320px;
    }
    body.dark {
      --bg-main: #0F172A;
      --bg-card: #1E293B;
      --bg-workspace: #0B0F19;
      --color-primary: #06B6D4;
      --color-primary-glow: rgba(6, 182, 212, 0.12);
      --color-text: #F8FAFC;
      --color-text-secondary: #94A3B8;
      --border-light: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-main);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden; /* 彻底封锁全局滚动条，打造全屏客户端质感 */
      height: 100vh;
    }

    /* ---------- Navbar ---------- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 28px; height: 28px; }
    .brand-text { font-size: 1.15rem; font-weight: 700; }
    .brand-text span { font-weight: 400; color: var(--color-text-secondary); }

    /* ---------- 工业级双栏网格架构 ---------- */
    .app-workspace {
      display: flex;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
    }

    /* 左侧控制台 */
    .sidebar-controls {
      width: var(--sidebar-width);
      background: var(--bg-card);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 24px 18px;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 200;
    }

    /* 右侧暗房画布区 */
    .canvas-darkroom {
      flex-grow: 1;
      background: var(--bg-workspace);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* 模块化通用卡片 */
    .control-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .block-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-text-secondary); }

    /* 上传组件 */
    .upload-zone {
      border: 2px dashed var(--border-light); border-radius: 12px;
      padding: 16px; text-align: center; cursor: pointer;
      background: var(--color-primary-glow); transition: all 0.2s;
    }
    .upload-zone:hover { border-color: var(--color-primary); }

    .thumb-list { display: flex; flex-wrap: wrap; gap: 8px; max-height: 130px; overflow-y: auto; padding: 4px 0; }
    .thumb-item {
      position: relative; width: 64px; height: 64px; border-radius: 6px;
      border: 1px solid var(--border-light); overflow: hidden; flex-shrink: 0;
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn {
      position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #EF4444; color: white; border: none;
      font-size: 10px; line-height: 14px; text-align: center; cursor: pointer; z-index: 5;
    }

    /* 垂直表单组件 */
    .btn-vertical-stack { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
      border: 1px solid var(--border-light); background: transparent; color: var(--color-text-secondary);
      cursor: pointer; transition: all 0.15s;
    }
    .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .btn.active { background: var(--color-primary); color: #0F172A !important; border-color: var(--color-primary); font-weight: 700; }
    .btn-primary { background: var(--color-primary); border-color: var(--color-primary); color: #0F172A; }
    .btn-danger { border-color: #EF4444; color: #EF4444; }
    .btn-danger:hover { background: #EF4444; color: white; }

    .slider-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .slider-row input[type="range"] { flex-grow: 1; margin: 0 10px; accent-color: var(--color-primary); }

    /* 核心智能画布（自适应包裹算法容器） */
    .canvas-container-mask {
      max-width: 100%; max-height: 100%;
      box-shadow: 0 25px 70px rgba(0,0,0,0.3);
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    #mainCanvas {
      max-width: 100%; max-height: calc(100vh - 120px); /* 强行在单屏内完美自适应缩放全显 */
      display: none; background: #ffffff; object-fit: contain;
    }
    .darkroom-placeholder { text-align: center; color: var(--color-text-secondary); }

    /* 浮动与画笔光标 */
    #brushCursor { position: fixed; pointer-events: none; border: 2px solid var(--color-primary); border-radius: 50%; background: rgba(6, 182, 212, 0.12); z-index: 5000; display: none; transform: translate(-50%, -50%); }
    #floatingMenu { position: fixed; display: none; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 60px; padding: 6px 14px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); z-index: 6000; gap: 8px; align-items: center; }
    #floatingMenu .menu-btn { background: transparent; border: none; color: #94A3B8; font-size: 0.9rem; padding: 6px 12px; border-radius: 40px; cursor: pointer; font-weight: 600; }
    #floatingMenu .menu-btn.active-mode { background: var(--color-primary); color: #0F172A !important; }

    /* VIP */
    .vip-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(6px); z-index: 9999; display: none; align-items: center; justify-content: center; }
    .vip-modal { background: var(--bg-card); border-radius: 24px; padding: 40px 32px; max-width: 400px; width: 90%; text-align: center; border: 1px solid var(--border-light); box-shadow: 0 30px 60px rgba(0,0,0,0.4); }

    /* 裁剪比例按钮 */
    .crop-ratio-btn { padding: 6px; border: 1px solid var(--border-light); border-radius: 8px; text-align: center; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    .crop-ratio-btn.active { background: var(--color-primary); color: #0F172A; font-weight: 700; }
  </style>
</head>
<body class="dark">

  <div class="vip-overlay" id="vipOverlay">
    <div class="vip-modal">
      <h2 class="text-2xl font-bold mb-2">🔒 试用已结束</h2>
      <p class="text-sm mb-6 var(--color-text-secondary)">您已完成 5 次商用导出。解锁 VIP 即可畅享无限高清生成。</p>
      <button class="btn btn-primary w-full" onclick="activateVIP()">一键开通 VIP（免费体验）</button>
    </div>
  </div>

  <div id="floatingMenu">
    <button class="menu-btn" data-mode="preview">📐 预览</button>
    <button class="menu-btn" data-mode="mosaic">🧩 马赛克</button>
    <button class="menu-btn" data-mode="blur">🌫️ 模糊</button>
    <div style="width:1px; height:16px; background:rgba(255,255,255,0.2)"></div>
    <button class="menu-btn" id="menuUndo">↩️</button>
    <button class="menu-btn" id="menuClear">🗑️</button>
  </div>

  <header class="navbar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284C7" /><stop offset="50%" stop-color="#06B6D4" /><stop offset="100%" stop-color="#3B82F6" /></linearGradient>
          <linearGradient id="lensGrad" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/></linearGradient>
        </defs>
        <path d="M20,40 C20,22 30,16 50,16 C70,16 80,22 80,40 L80,70 C80,82 70,86 50,86 C30,86 20,82 20,70 Z" fill="none" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round" />
        <path d="M40,72 C44,76 56,76 60,72" fill="none" stroke="url(#frameGrad)" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="32" cy="46" r="18" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5" /><circle cx="68" cy="46" r="18" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5" />
        <path d="M45,46 L55,46" stroke="url(#frameGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M27,41 L37,51 M37,41 L27,51" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" />
        <path d="M63,41 L73,51 M73,41 L63,51" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" />
      </svg>
      <span class="brand-text">修修图 <span>· 电商工作台</span></span>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span style="font-size:0.75rem; background:var(--color-primary); color:#0F172A; padding:2px 12px; border-radius:30px; font-weight:700;">PRO</span>
      <button class="theme-toggle" id="themeToggle">🌙 深色模式</button>
    </div>
  </header>

  <div class="app-workspace">
    
    <aside class="sidebar-controls">
      <div style="display:flex; gap:8px; border-bottom:1px solid var(--border-light); padding-bottom:12px;">
        <button class="btn tool-tab active" data-tool="stitch" style="padding:6px 12px;">📱 拼图打码</button>
        <button class="btn tool-tab" data-tool="listing" style="padding:6px 12px;">📦 一键上架</button>
      </div>

      <div id="sideStitch" class="flex flex-col gap-5">
        <div class="control-block">
          <span class="block-title">数据链入</span>
          <div class="upload-zone" id="uploadZone">
            <div class="text-2xl mb-1">📁</div>
            <p class="text-xs font-semibold">本地沙盒多图导入</p>
          </div>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />
          <div class="thumb-list" id="thumbList"></div>
        </div>

        <div class="control-block">
          <span class="block-title">物理参数</span>
          <div class="slider-row">
            <label>拼接间距</label>
            <input type="range" id="gapSlider" min="0" max="40" value="4" />
            <span id="gapLabel" style="color:var(--color-primary); font-weight:700;">4px</span>
          </div>
        </div>

        <div class="control-block">
          <span class="block-title">高频画笔工具</span>
          <div class="btn-vertical-stack">
            <button class="btn mode-btn active" data-mode="preview">📐 全局无损预览</button>
            <button class="btn mode-btn" data-mode="mosaic">🧩 局部脏区马赛克</button>
            <button class="btn mode-btn" data-mode="blur">🌫️ GPU 加速模糊</button>
            <button class="btn mode-btn" data-mode="crop">✂️ 智能网格裁剪</button>
          </div>
        </div>

        <div class="control-block" id="brushGroup" style="display:none;">
          <div class="slider-row">
            <label>画笔大小</label>
            <input type="range" id="brushSlider" min="10" max="150" value="40" />
            <span id="brushLabel" style="color:var(--color-primary); font-weight:700;">40</span>
          </div>
        </div>

        <div class="control-block" id="cropRatioPanel" style="display:none;">
          <span class="block-title">固定裁剪比例</span>
          <div class="grid grid-cols-2 gap-2">
            <button class="crop-ratio-btn active" data-ratio="free">自由</button>
            <button class="crop-ratio-btn" data-ratio="1:1">方形 1:1</button>
            <button class="crop-ratio-btn" data-ratio="4:3">标准 4:3</button>
            <button class="crop-ratio-btn" data-ratio="16:9">宽屏 16:9</button>
          </div>
          <div class="flex gap-2 mt-2">
            <button class="btn btn-primary flex-grow text-xs" id="applyCropBtn">✅ 确认切下</button>
            <button class="btn flex-grow text-xs" id="resetCropBtn">↩ 重置</button>
          </div>
        </div>

        <div class="control-block" style="border-top:1px solid var(--border-light); padding-top:16px;">
          <span class="block-title">终极交割</span>
          <div class="flex flex-col gap-2">
            <div class="flex items-center gap-2">
              <select id="exportFormat" class="flex-grow p-2 text-xs rounded-lg border" style="background:var(--bg-main); color:var(--text); border-color:var(--border-light);">
                <option value="image/jpeg">JPG 完美品质</option>
                <option value="image/png">PNG 透明无损</option>
                <option value="image/webp">WebP 高清抗压缩</option>
              </select>
            </div>
            <button class="btn btn-primary" id="exportBtn">⬇ 高清原图无损导出</button>
            <div class="grid grid-cols-2 gap-2">
              <button class="btn text-xs" id="undoBtn">↩ 撤销历史</button>
              <button class="btn btn-danger text-xs" id="clearBtn">🗑 清除沙盒</button>
            </div>
          </div>
        </div>
      </div>

      <div id="sideListing" class="flex flex-col gap-5" style="display:none;">
        <div class="control-block">
          <span class="block-title">原图链入</span>
          <div class="upload-zone" id="listingUploadZone">
            <div class="text-2xl mb-1">📦</div>
            <p class="text-xs font-semibold">拖入单个商品原画</p>
          </div>
          <input type="file" id="listingFileInput" accept="image/*" style="display:none;" />
          <div id="listingPreviewArea" style="display:none;" class="mt-2 text-center">
            <img id="listingPreviewImg" class="mx-auto rounded-lg max-h-32 border" />
            <button class="btn text-xs mt-2" onclick="resetListing()">换一张原图</button>
          </div>
        </div>

        <div class="control-block">
          <span class="block-title">多图适配包策略</span>
          <div class="flex flex-col gap-2 text-xs" id="platformSelector">
            <label class="flex items-center gap-2"><input type="checkbox" checked value="taobao" /> 淘宝主流全家桶</label>
            <label class="flex items-center gap-2"><input type="checkbox" value="pdd" /> 拼多多爆款矩阵</label>
            <label class="flex items-center gap-2"><input type="checkbox" value="douyin" /> 抖音视觉规格</label>
            <label class="flex items-center gap-2"><input type="checkbox" value="xiaohongshu" /> 小红书爆款竖图</label>
            <label class="flex items-center gap-2"><input type="checkbox" value="jingdong" /> 京东多焦段图</label>
            <label class="flex items-center gap-2"><input type="checkbox" value="amazon" /> 亚马逊高画质主辅</label>
          </div>
        </div>

        <div class="control-block">
          <span class="block-title">背景填充算法</span>
          <div class="flex gap-4 text-xs">
            <label class="flex items-center gap-1"><input type="radio" name="listingMode" value="whiteBg" checked /> 扩边纯白</label>
            <label class="flex items-center gap-1"><input type="radio" name="listingMode" value="direct" /> 强行等比</label>
          </div>
        </div>

        <button class="btn btn-primary mt-4" id="listingExportBtn" disabled>📦 一键全自动打包 ZIP</button>
      </div>
    </aside>

    <main class="canvas-darkroom">
      <div class="canvas-container-mask">
        <div class="darkroom-placeholder" id="placeholder">
          <p class="text-lg font-bold mb-2">✦ 图像处理暗房 ✦</p>
          <p class="text-sm opacity-60">请在左侧控制台导入电商原图素材</p>
        </div>
        <canvas id="mainCanvas"></canvas>
      </div>
      <div id="brushCursor"></div>
    </main>

  </div>

  <script>
    // ================================================================
    // 1. 双主题暗化切换
    // ================================================================
    (function() {
      const current = localStorage.getItem('xiuxiutu_theme') || 'dark';
      if(current === 'light') document.body.classList.add('light');
      const toggle = document.getElementById('themeToggle');
      toggle.textContent = current === 'light' ? '☀️ 浅色模式' : '🌙 深色模式';
      toggle.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('light');
        localStorage.setItem('xiuxiutu_theme', isLight ? 'light' : 'dark');
        toggle.textContent = isLight ? '☀️ 浅色模式' : '🌙 深色模式';
        if(uploadedImages.length) drawOverlay();
      });
    })();

    function activateVIP() {
      localStorage.setItem('xiuxiutu_vip', 'true');
      localStorage.setItem('xiuxiutu_exportCount', '0');
      document.getElementById('vipOverlay').style.display = 'none';
      alert('🎉 VIP无限生产力特权已激活！');
    }

    // ================================================================
    // 2. 核心状态机与DOM映射
    // ================================================================
    let uploadedImages = [];
    let gap = 4;
    let currentMode = 'preview';
    let brushSize = 40;
    let undoStack = [];
    let isDrawing = false;
    let lastPos = null;
    let cropRect = { x: 0, y: 0, w: 0, h: 0, ratio: 'free', dragging: false, startX: 0, startY: 0 };
    let editWidth = 1600; 
    let originalMaxWidth = 0;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const thumbList = document.getElementById('thumbList');
    const gapSlider = document.getElementById('gapSlider');
    const gapLabel = document.getElementById('gapLabel');
    const brushSlider = document.getElementById('brushSlider');
    const brushLabel = document.getElementById('brushLabel');
    const brushGroup = document.getElementById('brushGroup');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const cropRatioPanel = document.getElementById('cropRatioPanel');
    const cropRatioBtns = document.querySelectorAll('.crop-ratio-btn');
    const applyCropBtn = document.getElementById('applyCropBtn');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportFormat = document.getElementById('exportFormat');
    const brushCursor = document.getElementById('brushCursor');
    const placeholder = document.getElementById('placeholder');
    const toolTabs = document.querySelectorAll('.tool-tab');
    
    const floatingMenu = document.getElementById('floatingMenu');
    const menuBtns = floatingMenu.querySelectorAll('.menu-btn');
    const menuUndo = document.getElementById('menuUndo');
    const menuClear = document.getElementById('menuClear');

    // 双功能切页
    toolTabs.forEach(tab => {
      tab.addEventListener('click', function() {
        toolTabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        const isStitch = this.dataset.tool === 'stitch';
        document.getElementById('sideStitch').style.display = isStitch ? 'flex' : 'none';
        document.getElementById('sideListing').style.display = isStitch ? 'none' : 'flex';
      });
    });

    // ================================================================
    // 3. 核心拼接渲染核心算法
    // ================================================================
    function performStitch() {
      if (uploadedImages.length === 0) {
        canvas.width = 0; canvas.height = 0; canvas.style.display = 'none';
        placeholder.style.display = 'block'; updateThumbnails(); return;
      }
      placeholder.style.display = 'none'; canvas.style.display = 'block';

      originalMaxWidth = Math.max(...uploadedImages.map(item => item.originalWidth));
      const targetWidth = Math.min(originalMaxWidth, editWidth);

      let totalHeight = 0;
      uploadedImages.forEach((item, index) => {
        const scale = targetWidth / item.originalWidth;
        totalHeight += Math.round(item.originalHeight * scale);
        if (index < uploadedImages.length - 1) totalHeight += gap;
      });

      canvas.width = targetWidth; canvas.height = totalHeight;

      let yPos = 0;
      uploadedImages.forEach((item, index) => {
        const scale = targetWidth / item.originalWidth;
        const targetHeight = Math.round(item.originalHeight * scale);
        ctx.drawImage(item.img, 0, yPos, targetWidth, targetHeight);
        yPos += targetHeight;
        if (index < uploadedImages.length - 1) yPos += gap;
      });

      undoStack = [canvas.toDataURL('image/jpeg', 0.85)];
      updateThumbnails(); resetCrop();
    }

    function updateThumbnails() {
      thumbList.innerHTML = '';
      uploadedImages.forEach((item, index) => {
        const div = document.createElement('div'); div.className = 'thumb-item';
        div.innerHTML = `<img src="${item.src}"><button class="del-btn">×</button>`;
        div.querySelector('.del-btn').addEventListener('click', (e) => { e.stopPropagation(); uploadedImages.splice(index, 1); performStitch(); });
        thumbList.appendChild(div);
      });
    }

    function loadImageFiles(files) {
      let loaded = 0;
      let targetFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
      if(targetFiles.length === 0) return;
      
      targetFiles.forEach((f) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            uploadedImages.push({ img, src: e.target.result, originalWidth: img.width, originalHeight: img.height });
            loaded++; if (loaded === targetFiles.length) performStitch();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(f);
      });
    }

    // 绑定上传监听（彻底修复点击失效死穴）
    uploadZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', function() { if (this.files.length) loadImageFiles(this.files); });

    function undo() {
      if (undoStack.length <= 1) return;
      undoStack.pop();
      const img = new Image();
      img.onload = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0); if (currentMode === 'crop') drawOverlay(); };
      img.src = undoStack[undoStack.length - 1];
    }

    function clearAll() { uploadedImages = []; canvas.width = 0; canvas.height = 0; undoStack = []; updateThumbnails(); resetCrop(); canvas.style.display = 'none'; placeholder.style.display = 'block'; brushCursor.style.display = 'none'; }

    // 智能网格裁剪
    function resetCrop() { cropRect = { x: 0, y: 0, w: canvas.width, h: canvas.height, ratio: 'free', dragging: false, startX: 0, startY: 0 }; if (currentMode === 'crop') drawOverlay(); }

    function drawOverlay() {
      if (undoStack.length === 0) return;
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0);
        if (currentMode === 'crop') {
          const { x, y, w, h } = cropRect;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, canvas.width, y); ctx.fillRect(0, y, x, h);
          ctx.fillRect(x + w, y, canvas.width - x - w, h); ctx.fillRect(0, y + h, canvas.width, canvas.height - y - h);
          ctx.strokeStyle = document.body.classList.contains('light') ? '#0284C7' : '#06B6D4';
          ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]);
        }
      };
      img.src = undoStack[undoStack.length - 1];
    }

    function applyCrop() {
      if (cropRect.w < 10 || cropRect.h < 10) return;
      const { x, y, w, h } = cropRect;
      const data = ctx.getImageData(x, y, w, h);
      canvas.width = w; canvas.height = h; ctx.putImageData(data, 0, 0);
      undoStack.push(canvas.toDataURL('image/jpeg', 0.85)); resetCrop(); setMode('preview');
    }

    // 像素马赛克
    function applyMosaicAt(pos) {
      const half = brushSize / 2;
      const x = Math.max(0, Math.floor(pos.x - half)), y = Math.max(0, Math.floor(pos.y - half));
      const w = Math.min(brushSize, canvas.width - x), h = Math.min(brushSize, canvas.height - y);
      if (w <= 0 || h <= 0) return;
      const mSize = Math.max(4, Math.floor(brushSize / 8));
      const off = document.createElement('canvas'); off.width = mSize; off.height = Math.max(4, Math.floor(mSize * (h / w)));
      const oCtx = off.getContext('2d'); oCtx.imageSmoothingEnabled = false;
      oCtx.drawImage(canvas, x, y, w, h, 0, 0, off.width, off.height);
      ctx.save(); ctx.imageSmoothingEnabled = false; ctx.drawImage(off, x, y, w, h); ctx.restore();
    }

    // 模糊算法
    function applyBlurAt(pos) {
      const half = brushSize / 2;
      const x = Math.max(0, Math.floor(pos.x - half)), y = Math.max(0, Math.floor(pos.y - half));
      const w = Math.min(brushSize, canvas.width - x), h = Math.min(brushSize, canvas.height - y);
      if (w <= 0 || h <= 0) return;
      const temp = document.createElement('canvas'); temp.width = w; temp.height = h;
      temp.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, w, h);
      ctx.save(); ctx.beginPath(); ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2); ctx.clip();
      ctx.filter = 'blur(6px)'; ctx.drawImage(temp, x, y); ctx.restore();
    }

    function startDraw(e) {
      if (currentMode === 'preview' || uploadedImages.length === 0) return;
      e.preventDefault(); const pos = getCanvasPos(e);
      if (currentMode === 'crop') {
        cropRect.dragging = true; cropRect.startX = pos.x; cropRect.startY = pos.y;
        if (!(pos.x >= cropRect.x && pos.x <= cropRect.x + cropRect.w && pos.y >= cropRect.y && pos.y <= cropRect.y + cropRect.h)) { cropRect.x = pos.x; cropRect.y = pos.y; cropRect.w = 0; cropRect.h = 0; }
        return;
      }
      isDrawing = true; lastPos = pos;
      if (currentMode === 'mosaic') applyMosaicAt(pos); else if (currentMode === 'blur') applyBlurAt(pos);
    }

    function moveDraw(e) {
      if (currentMode === 'preview' || uploadedImages.length === 0) return;
      e.preventDefault(); const pos = getCanvasPos(e);
      if (currentMode === 'crop' && cropRect.dragging) {
        let w = Math.abs(pos.x - cropRect.startX), h = Math.abs(pos.y - cropRect.startY);
        let x = Math.min(cropRect.startX, pos.x), y = Math.min(cropRect.startY, pos.y);
        if (cropRect.ratio !== 'free') {
          const [rw, rh] = cropRect.ratio.split(':').map(Number); const target = rw / rh;
          if (w / h > target) w = h * target; else h = w / target;
          x = pos.x < cropRect.startX ? cropRect.startX - w : cropRect.startX; y = pos.y < cropRect.startY ? cropRect.startY - h : cropRect.startY;
        }
        cropRect.x = Math.max(0, x); cropRect.y = Math.max(0, y); cropRect.w = Math.min(w, canvas.width - cropRect.x); cropRect.h = Math.min(h, canvas.height - cropRect.y);
        drawOverlay(); return;
      }
      if (!isDrawing || !lastPos) return;
      const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);
      const steps = Math.ceil(dist / 3);
      for (let i = 1; i <= steps; i++) {
        const t = i / steps; const x = lastPos.x + (pos.x - lastPos.x) * t, y = lastPos.y + (pos.y - lastPos.y) * t;
        if (currentMode === 'mosaic') applyMosaicAt({ x, y }); else if (currentMode === 'blur') applyBlurAt({ x, y });
      }
      lastPos = pos;
    }

    function endDraw() { if (currentMode === 'crop') { cropRect.dragging = false; return; } if (isDrawing) { isDrawing = false; lastPos = null; undoStack.push(canvas.toDataURL('image/jpeg', 0.85)); if (undoStack.length > 20) undoStack.shift(); } }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX, clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }

    function setMode(mode) {
      currentMode = mode;
      modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      menuBtns.forEach(btn => btn.classList.toggle('active-mode', btn.dataset.mode === mode));
      brushGroup.style.display = (mode === 'preview' || mode === 'crop') ? 'none' : 'flex';
      cropRatioPanel.style.display = (mode === 'crop') ? 'block' : 'none';
      canvas.style.cursor = mode === 'preview' ? 'default' : 'crosshair';
      if (mode !== 'preview' && mode !== 'crop' && uploadedImages.length) {
        brushCursor.style.width = brushSize + 'px'; brushCursor.style.height = brushSize + 'px';
      } else brushCursor.style.display = 'none';
      drawOverlay();
    }

    function exportImage() {
      if (uploadedImages.length === 0) return;
      if (localStorage.getItem('xiuxiutu_vip') !== 'true') {
        let count = parseInt(localStorage.getItem('xiuxiutu_exportCount') || '0') + 1; localStorage.setItem('xiuxiutu_exportCount', count);
        if (count >= 5) { document.getElementById('vipOverlay').style.display = 'flex'; return; }
      }
      const exportCanvas = document.createElement('canvas'); const exportCtx = exportCanvas.getContext('2d'); const baseWidth = originalMaxWidth;
      let totalHeight = 0;
      uploadedImages.forEach((item, index) => { const scale = baseWidth / item.originalWidth; totalHeight += Math.round(item.originalHeight * scale); if (index < uploadedImages.length - 1) totalHeight += gap; });
      exportCanvas.width = baseWidth; exportCanvas.height = totalHeight;
      let yPos = 0;
      uploadedImages.forEach((item, index) => { const scale = baseWidth / item.originalWidth; const targetHeight = Math.round(item.originalHeight * scale); exportCtx.drawImage(item.img, 0, yPos, baseWidth, targetHeight); yPos += targetHeight; if (index < uploadedImages.length - 1) yPos += gap; });
      exportCtx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, exportCanvas.width, exportCanvas.height);
      let finalCanvas = exportCanvas;
      if (cropRect.w < canvas.width || cropRect.h < canvas.height) {
        const ratioX = baseWidth / canvas.width, ratioY = totalHeight / canvas.height;
        const cropped = document.createElement('canvas'); cropped.width = Math.round(cropRect.w * ratioX); cropped.height = Math.round(cropRect.h * ratioY);
        cropped.getContext('2d').drawImage(exportCanvas, Math.round(cropRect.x * ratioX), Math.round(cropRect.y * ratioY), cropped.width, cropped.height, 0, 0, cropped.width, cropped.height);
        finalCanvas = cropped;
      }
      finalCanvas.toBlob((blob) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `修修图_完美高清拼图_${Date.now()}.${exportFormat.value.split('/')[1]}`; a.click(); URL.revokeObjectURL(url); }, exportFormat.value, 0.95);
    }

    // 右键随手菜单弹出
    canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); floatingMenu.style.left = (e.clientX + 12) + 'px'; floatingMenu.style.top = (e.clientY + 12) + 'px'; floatingMenu.style.display = 'flex'; menuBtns.forEach(btn => btn.classList.toggle('active-mode', btn.dataset.mode === currentMode)); });
    menuBtns.forEach(btn => btn.addEventListener('click', function() { if (this.dataset.mode) setMode(this.dataset.mode); floatingMenu.style.display = 'none'; }));
    menuUndo.addEventListener('click', () => { undo(); floatingMenu.style.display = 'none'; });
    menuClear.addEventListener('click', () => { clearAll(); floatingMenu.style.display = 'none'; });
    floatingMenu.addEventListener('mouseleave', () => floatingMenu.style.display = 'none');
    document.addEventListener('click', (e) => { if (!floatingMenu.contains(e.target)) floatingMenu.style.display = 'none'; });

    // 其他事件监听
    gapSlider.addEventListener('input', function() { gap = parseInt(this.value); gapLabel.textContent = gap + 'px'; if (uploadedImages.length) performStitch(); });
    brushSlider.addEventListener('input', function() { brushSize = parseInt(this.value); brushLabel.textContent = brushSize; if (brushCursor.style.display === 'block') { brushCursor.style.width = brushSize + 'px'; brushCursor.style.height = brushSize + 'px'; } });
    modeBtns.forEach(btn => btn.addEventListener('click', function() { setMode(this.dataset.mode); }));
    cropRatioBtns.forEach(btn => { btn.addEventListener('click', function() { cropRatioBtns.forEach(b => b.classList.remove('active')); this.classList.add('active'); cropRect.ratio = this.dataset.ratio; if (canvas.width > 0 && cropRect.ratio !== 'free') { const [rw, rh] = cropRect.ratio.split(':').map(Number); const target = rw / rh; cropRect.w = canvas.width; cropRect.h = canvas.width / target; if (cropRect.h > canvas.height) { cropRect.h = canvas.height; cropRect.w = canvas.height * target; } drawOverlay(); } }); });
    applyCropBtn.addEventListener('click', applyCrop); resetCropBtn.addEventListener('click', resetCrop);

    const syncCursor = (cx, cy) => {
      if (currentMode !== 'preview' && currentMode !== 'crop' && uploadedImages.length) {
        const r = canvas.getBoundingClientRect();
        if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) { brushCursor.style.display = 'block'; brushCursor.style.left = cx + 'px'; brushCursor.style.top = cy + 'px'; return; }
      } brushCursor.style.display = 'none';
    };
    canvas.addEventListener('mousedown', startDraw); canvas.addEventListener('mousemove', (e) => { syncCursor(e.clientX, e.clientY); moveDraw(e); }); canvas.addEventListener('mouseup', endDraw); canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false }); canvas.addEventListener('touchmove', (e) => { const t = e.touches[0]; syncCursor(t.clientX, t.clientY); moveDraw(e); }, { passive: false }); canvas.addEventListener('touchend', endDraw);
    undoBtn.addEventListener('click', undo); clearBtn.addEventListener('click', clearAll); exportBtn.addEventListener('click', exportImage);

    // ================================================================
    // 4. 一键上架模块
    // ================================================================
    const listingUploadZone = document.getElementById('listingUploadZone');
    const listingFileInput = document.getElementById('listingFileInput');
    const listingPreviewArea = document.getElementById('listingPreviewArea');
    const listingPreviewImg = document.getElementById('listingPreviewImg');
    const listingExportBtn = document.getElementById('listingExportBtn');
    const platformSelector = document.getElementById('platformSelector');
    let listingImage = null;

    listingUploadZone.addEventListener('click', () => listingFileInput.click());
    listingFileInput.addEventListener('change', function() { if (this.files.length) { const r = new FileReader(); r.onload = (e) => { const img = new Image(); img.onload = () => { listingImage = img; listingPreviewImg.src = e.target.result; listingPreviewArea.style.display = 'block'; listingExportBtn.disabled = false; }; img.src = e.target.result; }; r.readAsDataURL(this.files[0]); } });
    function resetListing() { listingImage = null; listingPreviewArea.style.display = 'none'; listingExportBtn.disabled = true; }

    const P_SIZES = {
      taobao: { name: '淘宝', sizes: [{ label: '主图-白底', w: 800, h: 800, whiteBg: true }, { label: '主图-场景', w: 800, h: 800, whiteBg: false }] },
      pdd: { name: '拼多多', sizes: [{ label: '主图', w: 800, h: 800, whiteBg: false }, { label: '白底图', w: 480, h: 480, whiteBg: true }] },
      douyin: { name: '抖音', sizes: [{ label: '商品主图', w: 800, h: 800, whiteBg: false }, { label: '封面图', w: 1080, h: 1440, whiteBg: false }] },
      xiaohongshu: { name: '小红书', sizes: [{ label: '竖版笔记', w: 1080, h: 1440, whiteBg: false }, { label: '方图', w: 800, h: 800, whiteBg: false }] },
      jingdong: { name: '京东', sizes: [{ label: '主图-白底', w: 800, h: 800, whiteBg: true }, { label: '白底图(大)', w: 1000, h: 1000, whiteBg: true }] },
      amazon: { name: '亚马逊', sizes: [{ label: '主图-白底', w: 1600, h: 1600, whiteBg: true }, { label: '辅图', w: 1600, h: 1600, whiteBg: false }] }
    };

    listingExportBtn.addEventListener('click', async function() {
      if (!listingImage) return;
      const zip = new JSZip(); const mode = document.querySelector('input[name="listingMode"]:checked').value;
      const checked = Array.from(platformSelector.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
      checked.forEach(pKey => {
        const p = P_SIZES[pKey]; if (!p) return; const folder = zip.folder(p.name);
        p.sizes.forEach(sz => {
          const cvs = document.createElement('canvas'); let w = sz.w, h = sz.h === 0 ? Math.round(w / (listingImage.naturalWidth / listingImage.naturalHeight)) : sz.h;
          cvs.width = w; cvs.height = h; const c = cvs.getContext('2d');
          if (sz.whiteBg || mode === 'whiteBg') { c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, w, h); const s = Math.min(w / listingImage.naturalWidth, h / listingImage.naturalHeight); const dw = listingImage.naturalWidth * s, dh = listingImage.naturalHeight * s; c.drawImage(listingImage, (w - dw)/2, (h - dh)/2, dw, dh); }
          else { c.drawImage(listingImage, 0, 0, w, h); }
          folder.file(`${sz.label}_${w}×${h}.jpg`, cvs.toDataURL('image/jpeg', 0.9).split(',')[1], { base64: true });
        });
      });
      const blob = await zip.generateAsync({ type: 'blob' }); const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = '修修图_全平台图片包.zip'; a.click(); URL.revokeObjectURL(url);
    });

    console.log('✅ 修修图 · 电商工作台 全量通道无损修复完毕！');
  </script>
