<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>修修图·电商工作台 | 拼图 · 打码 · 裁剪 · 一键上架</title>
  <meta name="description" content="修修图电商工作台，多图拼接、隐私打码、裁剪、一键上架全平台。纯本地处理。">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    /* ========== 双主题变量 ========== */
    :root {
      --bg-main: #0F172A;
      --bg-card: #1E293B;
      --color-primary: #06B6D4;
      --color-primary-hover: #0891B2;
      --color-text: #F8FAFC;
      --color-text-secondary: #94A3B8;
      --color-text-muted: #64748B;
      --border-light: rgba(6, 182, 212, 0.15);
      --header-height: 60px;
      --left-panel-width: 320px;
    }
    body.light {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --color-primary: #0284C7;
      --color-primary-hover: #0369A1;
      --color-text: #0F172A;
      --color-text-secondary: #475569;
      --color-text-muted: #64748B;
      --border-light: rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg-main);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.6;
      transition: background 0.25s, color 0.25s;
      overflow: hidden; /* 防止整体滚动，右侧画布独立滚动 */
    }

    /* ---------- 顶部导航 ---------- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--header-height);
      padding: 0 24px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 36px; height: 36px; }
    .brand-text { font-size: 1.35rem; letter-spacing: -0.3px; }
    .brand-text strong { font-weight: 700; color: var(--color-text); }
    .brand-text span { font-weight: 400; color: var(--color-text-secondary); }

    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-links a { text-decoration: none; font-size: 0.95rem; font-weight: 600; color: var(--color-text-secondary); transition: color 0.2s; }
    .nav-links a:hover { color: var(--color-primary); }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid var(--border-light);
      background: transparent;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      transition: all 0.2s;
    }
    .theme-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); }

    /* ---------- 大双栏工作区 ---------- */
    .workspace {
      display: flex;
      height: calc(100vh - var(--header-height));
      overflow: hidden;
    }

    /* ---------- 左侧固定控制台 ---------- */
    .left-panel {
      width: var(--left-panel-width);
      min-width: var(--left-panel-width);
      background: var(--bg-card);
      border-right: 1px solid var(--border-light);
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .left-panel::-webkit-scrollbar { width: 4px; }
    .left-panel::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 4px; }

    /* 上传区 */
    .upload-zone {
      border: 2px dashed var(--border-light);
      border-radius: 12px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      background: rgba(6, 182, 212, 0.02);
      flex-shrink: 0;
    }
    .upload-zone:hover { border-color: var(--color-primary); background: rgba(6, 182, 212, 0.05); }
    .upload-zone .icon { font-size: 2.2rem; line-height: 1; }
    .upload-zone p { font-size: 0.85rem; font-weight: 600; color: var(--color-text); }
    .upload-zone .sub { font-size: 0.7rem; color: var(--color-text-muted); }

    /* 缩略图列表 */
    .thumb-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;
      padding: 4px 0;
      flex-shrink: 0;
    }
    .thumb-item {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 6px;
      border: 2px solid var(--border-light);
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item .del-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #EF4444;
      color: white;
      border: none;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
    }

    /* 控制组件 */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-group label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
    }
    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--color-primary);
      background: transparent;
      height: 4px;
    }
    .control-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .btn-primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #0F172A;
    }
    .btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); color: #0F172A; }
    .btn-danger { border-color: #EF4444; color: #EF4444; }
    .btn-danger:hover { background: #EF4444; color: white; }
    .btn-sm { padding: 3px 10px; font-size: 0.7rem; }

    .mode-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .mode-btn {
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #0F172A;
    }
    .mode-btn:hover:not(.active) { border-color: var(--color-primary); color: var(--color-primary); }

    .crop-ratio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .crop-ratio-btn {
      padding: 2px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .crop-ratio-btn.active { border-color: var(--color-primary); color: var(--color-primary); background: rgba(6,182,212,0.08); }

    .divider { border-top: 1px solid var(--border-light); margin: 4px 0; }

    /* 一键上架入口 */
    .listing-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-secondary);
    }
    .listing-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); background: rgba(6,182,212,0.05); }
    .listing-toggle .badge {
      background: #F97316;
      color: white;
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 30px;
    }

    /* 一键上架面板（折叠） */
    .listing-panel {
      display: none;
      background: var(--bg-main);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border-light);
      margin-top: 6px;
      flex-direction: column;
      gap: 8px;
    }
    .listing-panel.open { display: flex; }
    .listing-panel .upload-mini {
      border: 1px dashed var(--border-light);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.8rem;
    }
    .listing-panel .upload-mini:hover { border-color: var(--color-primary); background: rgba(6,182,212,0.05); }
    .listing-panel .platform-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .listing-panel .platform-checkboxes label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 30px;
      border: 1px solid var(--border-light);
      cursor: pointer;
      background: var(--bg-card);
    }
    .listing-panel .platform-checkboxes label input { accent-color: var(--color-primary); }

    /* ---------- 右侧画布区 ---------- */
    .right-canvas {
      flex: 1;
      background: var(--bg-main);
      padding: 16px;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .right-canvas::-webkit-scrollbar { width: 6px; height: 6px; }
    .right-canvas::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 4px; }

    .canvas-wrapper {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      overflow: hidden;
      display: inline-block;
      max-width: 100%;
      max-height: calc(100vh - var(--header-height) - 40px);
      position: relative;
    }
    .canvas-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: calc(100vh - var(--header-height) - 40px);
      object-fit: contain;
      background: #fff;
      cursor: default;
    }

    /* ---------- 画笔光标 ---------- */
    #brushCursor {
      position: fixed;
      pointer-events: none;
      border: 2px solid var(--color-primary);
      border-radius: 50%;
      background: rgba(6, 182, 212, 0.1);
      z-index: 1000;
      display: none;
      transform: translate(-50%, -50%);
      transition: width 0.1s, height 0.1s;
    }

    /* ---------- 右键悬浮菜单 ---------- */
    #floatingMenu {
      position: fixed;
      display: none;
      background: rgba(20, 30, 50, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 40px;
      padding: 6px 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      z-index: 2000;
      gap: 6px;
      align-items: center;
      pointer-events: auto;
    }
    #floatingMenu .menu-btn {
      background: transparent;
      border: none;
      color: var(--color-text);
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    #floatingMenu .menu-btn:hover {
      background: rgba(6, 182, 212, 0.2);
      color: var(--color-primary);
    }
    #floatingMenu .menu-btn.active-mode {
      background: var(--color-primary);
      color: #0F172A;
    }
    #floatingMenu .menu-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.2);
    }

    /* ---------- VIP ---------- */
    .vip-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .vip-overlay.show { display: flex; }
    .vip-modal {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid var(--border-light);
    }
    .vip-modal h2 { font-size: 1.8rem; margin-bottom: 12px; color: var(--color-text); }
    .vip-modal p { color: var(--color-text-secondary); margin-bottom: 24px; }
    .vip-modal .btn { width: 100%; justify-content: center; }
  </style>
</head>
<body>

  <!-- VIP 弹窗 -->
  <div class="vip-overlay" id="vipOverlay">
    <div class="vip-modal">
      <h2>🔒 试用已结束</h2>
      <p>您已完成 5 次导出。升级 VIP 可继续无限使用。</p>
      <button class="btn btn-primary" onclick="activateVIP()">升级 VIP（免费体验）</button>
      <p style="margin-top:16px; font-size:0.8rem; color:var(--color-text-muted);">点击即解锁，仅保存在本设备</p>
    </div>
  </div>

  <!-- 右键悬浮菜单 -->
  <div id="floatingMenu">
    <button class="menu-btn" data-mode="preview">📐</button>
    <button class="menu-btn" data-mode="mosaic">🧩</button>
    <button class="menu-btn" data-mode="blur">🌫️</button>
    <div class="menu-divider"></div>
    <button class="menu-btn" id="menuUndo">↩️</button>
    <button class="menu-btn" id="menuClear">🗑️</button>
  </div>

  <!-- ========== 顶部导航 ========== -->
  <header class="navbar">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="36" height="36">
        <defs>
          <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="50%" stop-color="#06B6D4" />
            <stop offset="100%" stop-color="#3B82F6" />
          </linearGradient>
          <linearGradient id="lensGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
          </linearGradient>
          <radialGradient id="pixelXGlow" cx="50%" cy="50%" r="40%">
            <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path d="M20,40 C20,22 30,16 50,16 C70,16 80,22 80,40 L80,70 C80,82 70,86 50,86 C30,86 20,82 20,70 Z" fill="none" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round" />
        <path d="M40,72 C44,76 56,76 60,72" fill="none" stroke="url(#frameGrad)" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="32" cy="46" r="18" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5" />
        <circle cx="68" cy="46" r="18" fill="url(#lensGrad)" stroke="url(#frameGrad)" stroke-width="4.5" />
        <path d="M45,46 L55,46" stroke="url(#frameGrad)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M27,41 L37,51 M37,41 L27,51" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="68" cy="46" r="8" fill="url(#pixelXGlow)" />
        <path d="M63,41 L73,51 M73,41 L63,51" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 1" />
      </svg>
      <span class="brand-text"><strong>修修图</strong><span> · 电商工作台</span></span>
    </div>
    <div class="nav-links">
      <a href="#home">首页</a>
      <a href="#tool">工具</a>
      <a href="#features">功能</a>
      <a href="#about">关于</a>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span style="font-size:0.7rem; background:var(--color-primary); color:#0F172A; padding:2px 12px; border-radius:30px; font-weight:700;">VIP</span>
      <button class="theme-toggle" id="themeToggle">🌙 深色模式</button>
    </div>
  </header>

  <!-- ========== 大双栏工作区 ========== -->
  <div class="workspace">

    <!-- 左侧固定控制台 -->
    <aside class="left-panel">
      <!-- 上传区 -->
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📁</div>
        <p>点击或拖拽上传图片</p>
        <div class="sub">支持多张，JPG/PNG/WebP</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />

      <!-- 缩略图列表 -->
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--color-text-muted);">图片列表</span>
          <span id="imageCount" style="font-size:0.65rem; color:var(--color-text-muted);">0 张</span>
        </div>
        <div class="thumb-list" id="thumbList"></div>
      </div>

      <!-- 间距 -->
      <div class="control-group">
        <label>间距 <span id="gapLabel">4px</span></label>
        <input type="range" id="gapSlider" min="0" max="40" value="4" />
      </div>

      <!-- 模式切换 -->
      <div>
        <span style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--color-text-muted);">编辑模式</span>
        <div class="mode-group">
          <button class="mode-btn active" data-mode="preview">📐 预览</button>
          <button class="mode-btn" data-mode="mosaic">🧩 马赛克</button>
          <button class="mode-btn" data-mode="blur">🌫️ 模糊</button>
          <button class="mode-btn" data-mode="crop">✂️ 裁剪</button>
        </div>
      </div>

      <!-- 画笔大小（打码模式） -->
      <div class="control-group" id="brushGroup" style="display:none;">
        <label>画笔大小 <span id="brushLabel">30</span></label>
        <input type="range" id="brushSlider" min="4" max="120" value="30" />
      </div>

      <!-- 裁剪比例（裁剪模式） -->
      <div id="cropRatioPanel" style="display:none;">
        <span style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--color-text-muted);">裁剪比例</span>
        <div class="crop-ratio-group">
          <button class="crop-ratio-btn active" data-ratio="free">自由</button>
          <button class="crop-ratio-btn" data-ratio="1:1">1:1</button>
          <button class="crop-ratio-btn" data-ratio="4:3">4:3</button>
          <button class="crop-ratio-btn" data-ratio="16:9">16:9</button>
        </div>
        <div style="display:flex; gap:6px; margin-top:4px;">
          <button class="btn btn-sm btn-primary" id="applyCropBtn">✅ 确认</button>
          <button class="btn btn-sm" id="resetCropBtn">↩ 重置</button>
        </div>
      </div>

      <!-- 操作按钮组 -->
      <div class="control-row" style="margin-top:4px;">
        <button class="btn btn-sm" id="undoBtn">↩ 撤销</button>
        <button class="btn btn-sm btn-danger" id="clearBtn">🗑 清除</button>
        <button class="btn btn-sm btn-primary" id="exportBtn">⬇ 导出</button>
        <select id="exportFormat" style="background:var(--bg-main); color:var(--color-text); border:1px solid var(--border-light); border-radius:6px; padding:2px 8px; font-size:0.7rem;">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>

      <div class="divider"></div>

      <!-- 一键上架入口 -->
      <div>
        <div class="listing-toggle" id="listingToggle">
          📦 一键上架 <span class="badge">VIP</span>
          <span style="margin-left:auto; font-size:0.7rem;">▼</span>
        </div>
        <div class="listing-panel" id="listingPanel">
          <div class="upload-mini" id="listingUploadZone">
            📤 点击上传商品主图
          </div>
          <input type="file" id="listingFileInput" accept="image/*" style="display:none;" />
          <div id="listingPreviewArea" style="display:none; text-align:center;">
            <img id="listingPreviewImg" style="max-width:100px; max-height:100px; border-radius:6px; border:1px solid var(--border-light);" />
            <button class="btn btn-sm" onclick="resetListing()">重新选择</button>
          </div>
          <div>
            <div style="font-size:0.65rem; font-weight:700; text-transform:uppercase; color:var(--color-text-muted); margin-bottom:4px;">目标平台</div>
            <div class="platform-checkboxes" id="platformSelector">
              <label><input type="checkbox" checked value="taobao" /> 淘宝</label>
              <label><input type="checkbox" value="pdd" /> 拼多多</label>
              <label><input type="checkbox" value="douyin" /> 抖音</label>
              <label><input type="checkbox" value="xiaohongshu" /> 小红书</label>
              <label><input type="checkbox" value="jingdong" /> 京东</label>
              <label><input type="checkbox" value="amazon" /> 亚马逊</label>
            </div>
          </div>
          <div style="display:flex; gap:12px; font-size:0.7rem; color:var(--color-text-secondary);">
            <label><input type="radio" name="listingMode" value="whiteBg" checked /> 白底适配</label>
            <label><input type="radio" name="listingMode" value="direct" /> 直接缩放</label>
          </div>
          <button class="btn btn-primary btn-sm" id="listingExportBtn" disabled style="width:100%; justify-content:center;">📦 生成图片包</button>
        </div>
      </div>
    </aside>

    <!-- 右侧画布区 -->
    <main class="right-canvas" id="rightCanvas">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas"></canvas>
      </div>
      <div id="brushCursor"></div>
    </main>
  </div>

  <script>
    // ================================================================
    // 1. 主题切换
    // ================================================================
    (function initTheme() {
      const saved = localStorage.getItem('xiuxiutu_theme') || 'dark';
      const body = document.body;
      const btn = document.getElementById('themeToggle');
      if (saved === 'light') { body.classList.add('light'); btn.textContent = '☀️ 浅色模式'; }
      else { body.classList.remove('light'); btn.textContent = '🌙 深色模式'; }
      btn.addEventListener('click', function() {
        if (body.classList.contains('light')) {
          body.classList.remove('light');
          localStorage.setItem('xiuxiutu_theme', 'dark');
          btn.textContent = '🌙 深色模式';
        } else {
          body.classList.add('light');
          localStorage.setItem('xiuxiutu_theme', 'light');
          btn.textContent = '☀️ 浅色模式';
        }
      });
    })();

    // ================================================================
    // 2. VIP 计费墙
    // ================================================================
    (function initVIP() {
      const isVIP = localStorage.getItem('xiuxiutu_vip') === 'true';
      if (!isVIP) {
        if (localStorage.getItem('xiuxiutu_exportCount') === null) localStorage.setItem('xiuxiutu_exportCount', '0');
        const count = parseInt(localStorage.getItem('xiuxiutu_exportCount') || '0');
        if (count >= 5) document.getElementById('vipOverlay').classList.add('show');
      }
      window.activateVIP = function() {
        localStorage.setItem('xiuxiutu_vip', 'true');
        localStorage.setItem('xiuxiutu_exportCount', '0');
        document.getElementById('vipOverlay').classList.remove('show');
        alert('🎉 VIP 已激活！');
      };
      if (localStorage.getItem('xiuxiutu_vip') === 'true') {
        document.getElementById('vipOverlay').classList.remove('show');
        localStorage.setItem('xiuxiutu_exportCount', '0');
      }
    })();

    // ================================================================
    // 3. 核心算法（完整无缺）
    // ================================================================
    // ---------- 全局状态 ----------
    let uploadedImages = [];          // 存储 { img, src, name, originalWidth, originalHeight }
    let gap = 4;
    let currentMode = 'preview';
    let brushSize = 30;
    let undoStack = [];
    let isDrawing = false;
    let lastPos = null;
    let cropRect = { x: 0, y: 0, w: 0, h: 0, ratio: 'free', dragging: false, startX: 0, startY: 0 };
    let originalMaxWidth = 0;

    // DOM 引用
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.querySelector('.canvas-wrapper');
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const thumbList = document.getElementById('thumbList');
    const imageCount = document.getElementById('imageCount');
    const gapSlider = document.getElementById('gapSlider');
    const gapLabel = document.getElementById('gapLabel');
    const brushSlider = document.getElementById('brushSlider');
    const brushLabel = document.getElementById('brushLabel');
    const brushGroup = document.getElementById('brushGroup');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const cropRatioPanel = document.getElementById('cropRatioPanel');
    const cropRatioBtns = document.querySelectorAll('.crop-ratio-btn');
    const applyCropBtn = document.getElementById('applyCropBtn');
    const resetCropBtn = document.getElementById('resetCropBtn');
    const undoBtn = document.getElementById('undoBtn');
    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportFormat = document.getElementById('exportFormat');
    const brushCursor = document.getElementById('brushCursor');

    // 右键菜单
    const floatingMenu = document.getElementById('floatingMenu');
    const menuBtns = floatingMenu.querySelectorAll('.menu-btn');
    const menuUndo = document.getElementById('menuUndo');
    const menuClear = document.getElementById('menuClear');

    // ---------- 上传事件绑定（钢铁通道） ----------
    // 点击上传
    uploadZone.addEventListener('click', () => {
      fileInput.click();
    });
    // 文件选择
    fileInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        loadImageFiles(this.files);
      }
      this.value = '';
    });
    // 拖拽上传
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--color-primary)';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.borderColor = '';
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = '';
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadImageFiles(e.dataTransfer.files);
      }
    });

    // ---------- 多图拼接（自适应等比无损） ----------
    function performStitch() {
      if (uploadedImages.length === 0) {
        canvas.width = 0;
        canvas.height = 0;
        ctx.clearRect(0, 0, 0, 0);
        updateThumbnails();
        return;
      }

      // 基准宽度：取最大原始宽度，但限制在 1600px 内防止性能问题
      const maxOrigWidth = Math.max(...uploadedImages.map(item => item.originalWidth));
      const targetWidth = Math.min(maxOrigWidth, 1600);

      // 计算总高度（按缩放后的实际高度四舍五入）
      let totalHeight = 0;
      const scaledHeights = [];
      uploadedImages.forEach((item) => {
        const scale = targetWidth / item.originalWidth;
        const targetHeight = Math.round(item.originalHeight * scale);
        scaledHeights.push(targetHeight);
        totalHeight += targetHeight;
      });
      totalHeight += (uploadedImages.length - 1) * gap;

      canvas.width = targetWidth;
      canvas.height = totalHeight;

      let yPos = 0;
      uploadedImages.forEach((item, index) => {
        const scale = targetWidth / item.originalWidth;
        const targetHeight = Math.round(item.originalHeight * scale);
        ctx.drawImage(item.img, 0, yPos, targetWidth, targetHeight);
        yPos += targetHeight;
        if (index < uploadedImages.length - 1) yPos += gap;
      });

      // 保存初始状态到撤销栈
      undoStack.push(canvas.toDataURL());
      updateThumbnails();
      resetCrop();
    }

    // ---------- 缩略图更新 ----------
    function updateThumbnails() {
      thumbList.innerHTML = '';
      uploadedImages.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'thumb-item';
        const img = document.createElement('img');
        img.src = item.src;
        div.appendChild(img);
        const del = document.createElement('button');
        del.className = 'del-btn';
        del.textContent = '×';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          removeImage(index);
        });
        div.appendChild(del);
        thumbList.appendChild(div);
      });
      imageCount.textContent = uploadedImages.length + ' 张';
    }

    function removeImage(index) {
      if (index >= 0 && index < uploadedImages.length) {
        uploadedImages.splice(index, 1);
        performStitch();
        // 重置撤销栈
        undoStack = [];
        if (canvas.width > 0 && canvas.height > 0) {
          undoStack.push(canvas.toDataURL());
        }
      }
    }

    // ---------- 加载图片 ----------
    function loadImageFiles(files) {
      for (let f of files) {
        if (!f.type.startsWith('image/')) continue;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            uploadedImages.push({
              img: img,
              src: e.target.result,
              name: f.name,
              originalWidth: img.width,
              originalHeight: img.height
            });
            performStitch();
            // 重置撤销栈
            undoStack = [];
            if (canvas.width > 0 && canvas.height > 0) {
              undoStack.push(canvas.toDataURL());
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(f);
      }
    }

    // ---------- 撤销 ----------
    function undo() {
      if (undoStack.length <= 1) return;
      undoStack.pop();
      const prevState = undoStack[undoStack.length - 1];
      if (prevState) {
        const img = new Image();
        img.onload = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          resetCrop();
        };
        img.src = prevState;
      }
    }

    // ---------- 清除 ----------
    function clearAll() {
      uploadedImages = [];
      canvas.width = 0;
      canvas.height = 0;
      ctx.clearRect(0, 0, 0, 0);
      undoStack = [];
      updateThumbnails();
      resetCrop();
      brushCursor.style.display = 'none';
    }

    // ---------- 裁剪 ----------
    function resetCrop() {
      cropRect = { x: 0, y: 0, w: 0, h: 0, ratio: 'free', dragging: false, startX: 0, startY: 0 };
      if (canvas.width > 0 && canvas.height > 0) {
        cropRect.w = canvas.width;
        cropRect.h = canvas.height;
      }
      drawOverlay();
    }

    function drawOverlay() {
      if (undoStack.length === 0) return;
      const currentState = undoStack[undoStack.length - 1];
      if (!currentState) return;
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        if (currentMode === 'crop' && cropRect.w > 0 && cropRect.h > 0) {
          const { x, y, w, h } = cropRect;
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(0, 0, canvas.width, y);
          ctx.fillRect(0, y, x, h);
          ctx.fillRect(x + w, y, canvas.width - x - w, h);
          ctx.fillRect(0, y + h, canvas.width, canvas.height - y - h);
          ctx.strokeStyle = '#06B6D4';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);
          const corners = [[x,y],[x+w,y],[x,y+h],[x+w,y+h]];
          corners.forEach(([cx,cy]) => {
            ctx.fillStyle = '#06B6D4';
            ctx.fillRect(cx-4, cy-4, 8, 8);
          });
        }
      };
      img.src = currentState;
    }

    function applyCrop() {
      if (cropRect.w < 10 || cropRect.h < 10) return;
      const { x, y, w, h } = cropRect;
      const imageData = ctx.getImageData(x, y, w, h);
      canvas.width = w;
      canvas.height = h;
      ctx.putImageData(imageData, 0, 0);
      undoStack.pop();
      undoStack.push(canvas.toDataURL());
      resetCrop();
      setMode('preview');
    }

    // ---------- 打码（马赛克局部离屏缩放） ----------
    function applyMosaicAt(pos) {
      const half = brushSize / 2;
      const x = Math.max(0, pos.x - half);
      const y = Math.max(0, pos.y - half);
      const w = Math.min(brushSize, canvas.width - x);
      const h = Math.min(brushSize, canvas.height - y);
      if (w <= 0 || h <= 0) return;
      const mosaicSize = Math.max(2, Math.floor(brushSize / 6));
      const offscreen = document.createElement('canvas');
      offscreen.width = mosaicSize;
      offscreen.height = Math.floor(mosaicSize * (h / w));
      const offCtx = offscreen.getContext('2d');
      offCtx.imageSmoothingEnabled = false;
      offCtx.drawImage(canvas, x, y, w, h, 0, 0, offscreen.width, offscreen.height);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offscreen, x, y, w, h);
    }

    // ---------- 模糊（GPU加速） ----------
    function applyBlurAt(pos) {
      const half = brushSize / 2;
      const x = Math.max(0, pos.x - half);
      const y = Math.max(0, pos.y - half);
      const w = Math.min(brushSize, canvas.width - x);
      const h = Math.min(brushSize, canvas.height - y);
      if (w <= 0 || h <= 0) return;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.drawImage(canvas, x, y, w, h, 0, 0, w, h);
      ctx.save();
      ctx.filter = 'blur(8px)';
      ctx.drawImage(tempCanvas, x, y, w, h);
      ctx.restore();
    }

    // ---------- 绘制事件 ----------
    function startDraw(e) {
      e.preventDefault();
      if (currentMode === 'preview') return;
      if (currentMode === 'crop') {
        const pos = getCanvasPos(e);
        if (cropRect.w > 0 && cropRect.h > 0) {
          cropRect.dragging = true;
          cropRect.startX = pos.x;
          cropRect.startY = pos.y;
          // 检测是否在框内，否则新建框
          if (pos.x >= cropRect.x && pos.x <= cropRect.x + cropRect.w &&
              pos.y >= cropRect.y && pos.y <= cropRect.y + cropRect.h) {
            // 拖拽整个框
          } else {
            cropRect.x = pos.x;
            cropRect.y = pos.y;
            cropRect.w = 0;
            cropRect.h = 0;
          }
        } else {
          cropRect.x = pos.x;
          cropRect.y = pos.y;
          cropRect.w = 0;
          cropRect.h = 0;
          cropRect.dragging = true;
          cropRect.startX = pos.x;
          cropRect.startY = pos.y;
        }
        return;
      }
      // 打码模式
      const pos = getCanvasPos(e);
      isDrawing = true;
      lastPos = pos;
      if (currentMode === 'mosaic') applyMosaicAt(pos);
      else if (currentMode === 'blur') applyBlurAt(pos);
      else if (currentMode === 'solid') {
        ctx.fillStyle = '#333333';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function moveDraw(e) {
      e.preventDefault();
      if (currentMode === 'preview') return;
      if (currentMode === 'crop') {
        if (!cropRect.dragging) return;
        const pos = getCanvasPos(e);
        let x = Math.min(cropRect.startX, pos.x);
        let y = Math.min(cropRect.startY, pos.y);
        let w = Math.abs(pos.x - cropRect.startX);
        let h = Math.abs(pos.y - cropRect.startY);
        if (cropRect.ratio !== 'free') {
          const [rw, rh] = cropRect.ratio.split(':').map(Number);
          const target = rw / rh;
          if (w / h > target) w = h * target;
          else h = w / target;
          const cx = (cropRect.startX + pos.x) / 2;
          const cy = (cropRect.startY + pos.y) / 2;
          x = cx - w / 2;
          y = cy - h / 2;
        }
        cropRect.x = Math.max(0, x);
        cropRect.y = Math.max(0, y);
        cropRect.w = Math.min(w, canvas.width - cropRect.x);
        cropRect.h = Math.min(h, canvas.height - cropRect.y);
        drawOverlay();
        return;
      }
      if (!isDrawing || !lastPos) return;
      const pos = getCanvasPos(e);
      const dist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);
      if (dist > 2) {
        const steps = Math.ceil(dist / 4);
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = lastPos.x + (pos.x - lastPos.x) * t;
          const y = lastPos.y + (pos.y - lastPos.y) * t;
          if (currentMode === 'mosaic') applyMosaicAt({ x, y });
          else if (currentMode === 'blur') applyBlurAt({ x, y });
          else if (currentMode === 'solid') {
            ctx.fillStyle = '#333333';
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        lastPos = pos;
      }
    }

    function endDraw(e) {
      if (currentMode === 'crop') {
        cropRect.dragging = false;
        return;
      }
      if (isDrawing) {
        isDrawing = false;
        if (canvas.width > 0 && canvas.height > 0) {
          undoStack.push(canvas.toDataURL());
          if (undoStack.length > 30) undoStack.shift();
        }
      }
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    // ---------- 模式切换 ----------
    function setMode(mode) {
      currentMode = mode;
      modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
      menuBtns.forEach(btn => {
        btn.classList.toggle('active-mode', btn.dataset.mode === mode);
      });
      brushGroup.style.display = (mode === 'preview' || mode === 'crop') ? 'none' : 'flex';
      cropRatioPanel.style.display = (mode === 'crop') ? 'block' : 'none';
      if (mode === 'preview') {
        canvas.style.cursor = 'default';
        brushCursor.style.display = 'none';
      } else if (mode === 'crop') {
        canvas.style.cursor = 'crosshair';
        brushCursor.style.display = 'none';
      } else {
        canvas.style.cursor = 'none';
        brushCursor.style.display = 'block';
        brushCursor.style.width = brushSize + 'px';
        brushCursor.style.height = brushSize + 'px';
      }
      if (mode === 'crop' && canvas.width > 0 && cropRect.w === 0) {
        cropRect.x = 0;
        cropRect.y = 0;
        cropRect.w = canvas.width;
        cropRect.h = canvas.height;
      }
      drawOverlay();
    }

    // ---------- 导出（含VIP计费） ----------
    function exportImage() {
      if (uploadedImages.length === 0) {
        alert('请先上传图片！');
        return;
      }
      const isVIP = localStorage.getItem('xiuxiutu_vip') === 'true';
      if (!isVIP) {
        let count = parseInt(localStorage.getItem('xiuxiutu_exportCount') || '0');
        count++;
        localStorage.setItem('xiuxiutu_exportCount', count);
        if (count >= 5) {
          document.getElementById('vipOverlay').classList.add('show');
          return;
        }
      }
      // 原始尺寸导出
      const originalWidth = Math.max(...uploadedImages.map(item => item.originalWidth));
      const exportCanvas = document.createElement('canvas');
      let totalHeight = 0;
      uploadedImages.forEach((item, index) => {
        totalHeight += item.originalHeight;
        if (index < uploadedImages.length - 1) totalHeight += gap;
      });
      exportCanvas.width = originalWidth;
      exportCanvas.height = totalHeight;
      const exportCtx = exportCanvas.getContext('2d');
      let yPos = 0;
      uploadedImages.forEach((item, index) => {
        exportCtx.drawImage(item.img, 0, yPos, item.originalWidth, item.originalHeight);
        yPos += item.originalHeight;
        if (index < uploadedImages.length - 1) yPos += gap;
      });
      let finalCanvas = exportCanvas;
      // 裁剪映射
      if (cropRect.w > 0 && cropRect.h > 0 && cropRect.w < originalWidth && cropRect.h < totalHeight) {
        const scaleX = originalWidth / canvas.width;
        const scaleY = totalHeight / canvas.height;
        const cropX = Math.round(cropRect.x * scaleX);
        const cropY = Math.round(cropRect.y * scaleY);
        const cropW = Math.round(cropRect.w * scaleX);
        const cropH = Math.round(cropRect.h * scaleY);
        const imageData = exportCtx.getImageData(cropX, cropY, cropW, cropH);
        const croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = cropW;
        croppedCanvas.height = cropH;
        croppedCanvas.getContext('2d').putImageData(imageData, 0, 0);
        finalCanvas = croppedCanvas;
      }
      const format = exportFormat.value;
      const quality = 0.92;
      finalCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `修修图_拼图.${format.split('/')[1]}`;
        a.click();
        URL.revokeObjectURL(url);
      }, format, quality);
    }

    // ---------- 右键悬浮菜单 ----------
    canvas.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      floatingMenu.style.left = (e.clientX + 10) + 'px';
      floatingMenu.style.top = (e.clientY + 10) + 'px';
      floatingMenu.style.display = 'flex';
      menuBtns.forEach(btn => {
        btn.classList.toggle('active-mode', btn.dataset.mode === currentMode);
      });
    });

    menuBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode) {
          setMode(mode);
          modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        }
        floatingMenu.style.display = 'none';
      });
    });

    menuUndo.addEventListener('click', function() {
      undo();
      floatingMenu.style.display = 'none';
    });
    menuClear.addEventListener('click', function() {
      clearAll();
      floatingMenu.style.display = 'none';
    });

    floatingMenu.addEventListener('mouseleave', function() {
      floatingMenu.style.display = 'none';
    });
    document.addEventListener('click', function(e) {
      if (!floatingMenu.contains(e.target)) {
        floatingMenu.style.display = 'none';
      }
    });

    // ---------- 事件绑定 ----------
    gapSlider.addEventListener('input', function() {
      gap = parseInt(this.value);
      gapLabel.textContent = gap + 'px';
      if (uploadedImages.length > 0) {
        performStitch();
        undoStack = [];
        undoStack.push(canvas.toDataURL());
        resetCrop();
        if (currentMode === 'crop') drawOverlay();
      }
    });

    brushSlider.addEventListener('input', function() {
      brushSize = parseInt(this.value);
      brushLabel.textContent = brushSize;
      if (currentMode !== 'preview' && currentMode !== 'crop') {
        brushCursor.style.width = brushSize + 'px';
        brushCursor.style.height = brushSize + 'px';
      }
    });

    modeBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        setMode(this.dataset.mode);
      });
    });

    cropRatioBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        cropRatioBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        cropRect.ratio = this.dataset.ratio;
        if (cropRect.w > 0 && cropRect.h > 0) {
          const [rw, rh] = cropRect.ratio.split(':').map(Number);
          const target = rw / rh;
          const current = cropRect.w / cropRect.h;
          if (current > target) cropRect.w = cropRect.h * target;
          else cropRect.h = cropRect.w / target;
          drawOverlay();
        }
      });
    });

    applyCropBtn.addEventListener('click', applyCrop);
    resetCropBtn.addEventListener('click', function() {
      if (canvas.width > 0 && canvas.height > 0) {
        cropRect.x = 0;
        cropRect.y = 0;
        cropRect.w = canvas.width;
        cropRect.h = canvas.height;
        drawOverlay();
      }
    });

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', (e) => {
      if (currentMode !== 'preview' && currentMode !== 'crop') {
        brushCursor.style.left = e.clientX + 'px';
        brushCursor.style.top = e.clientY + 'px';
      }
      moveDraw(e);
    });
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      if (currentMode !== 'preview' && currentMode !== 'crop') {
        const touch = e.touches[0];
        brushCursor.style.left = touch.clientX + 'px';
        brushCursor.style.top = touch.clientY + 'px';
      }
      moveDraw(e);
    }, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    undoBtn.addEventListener('click', undo);
    clearBtn.addEventListener('click', clearAll);
    exportBtn.addEventListener('click', exportImage);

    // 初始化
    setMode('preview');

    // ================================================================
    // 4. 一键上架（完整保留）
    // ================================================================
    const listingToggle = document.getElementById('listingToggle');
    const listingPanel = document.getElementById('listingPanel');
    const listingUploadZone = document.getElementById('listingUploadZone');
    const listingFileInput = document.getElementById('listingFileInput');
    const listingPreviewArea = document.getElementById('listingPreviewArea');
    const listingPreviewImg = document.getElementById('listingPreviewImg');
    const listingExportBtn = document.getElementById('listingExportBtn');
    const platformSelector = document.getElementById('platformSelector');
    let listingImage = null;

    // 展开/折叠
    listingToggle.addEventListener('click', () => {
      listingPanel.classList.toggle('open');
    });

    // 上传
    listingUploadZone.addEventListener('click', () => listingFileInput.click());
    listingUploadZone.addEventListener('dragover', (e) => e.preventDefault());
    listingUploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadListingImage(file);
    });
    listingFileInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) loadListingImage(this.files[0]);
      this.value = '';
    });

    function loadListingImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          listingImage = img;
          listingPreviewImg.src = e.target.result;
          listingPreviewArea.style.display = 'block';
          updateListingExportBtn();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetListing() {
      listingImage = null;
      listingPreviewArea.style.display = 'none';
      listingPreviewImg.src = '';
      updateListingExportBtn();
    }

    function getSelectedPlatforms() {
      const checkboxes = platformSelector.querySelectorAll('input[type="checkbox"]:checked');
      return Array.from(checkboxes).map(cb => cb.value);
    }

    function getListingMode() {
      const radio = document.querySelector('input[name="listingMode"]:checked');
      return radio ? radio.value : 'whiteBg';
    }

    function updateListingExportBtn() {
      const selected = getSelectedPlatforms();
      listingExportBtn.disabled = !listingImage || selected.length === 0;
    }

    platformSelector.addEventListener('change', updateListingExportBtn);
    document.querySelectorAll('input[name="listingMode"]').forEach(radio => {
      radio.addEventListener('change', updateListingExportBtn);
    });

    const PLATFORM_SIZES = {
      taobao: { name: '淘宝', sizes: [{ label: '主图-白底', w: 800, h: 800, whiteBg: true }, { label: '主图-场景', w: 800, h: 800, whiteBg: false }, { label: '详情图', w: 750, h: 0, whiteBg: false }, { label: 'PC主图', w: 460, h: 460, whiteBg: false }] },
      pdd: { name: '拼多多', sizes: [{ label: '主图', w: 800, h: 800, whiteBg: false }, { label: '轮播图', w: 800, h: 800, whiteBg: false }, { label: '详情图', w: 750, h: 0, whiteBg: false }, { label: '白底图', w: 480, h: 480, whiteBg: true }] },
      douyin: { name: '抖音', sizes: [{ label: '商品主图', w: 800, h: 800, whiteBg: false }, { label: '详情图', w: 750, h: 0, whiteBg: false }, { label: '封面图', w: 1080, h: 1440, whiteBg: false }] },
      xiaohongshu: { name: '小红书', sizes: [{ label: '竖版笔记', w: 1080, h: 1440, whiteBg: false }, { label: '横版封面', w: 1440, h: 1080, whiteBg: false }, { label: '方图', w: 800, h: 800, whiteBg: false }] },
      jingdong: { name: '京东', sizes: [{ label: '主图-白底', w: 800, h: 800, whiteBg: true }, { label: '主图-场景', w: 800, h: 800, whiteBg: false }, { label: '详情图', w: 750, h: 0, whiteBg: false }, { label: '白底图(大)', w: 1000, h: 1000, whiteBg: true }] },
      amazon: { name: '亚马逊', sizes: [{ label: '主图-白底', w: 1600, h: 1600, whiteBg: true }, { label: '辅图', w: 1600, h: 1600, whiteBg: false }, { label: 'A+内容图', w: 970, h: 600, whiteBg: false }] }
    };

    listingExportBtn.addEventListener('click', async function() {
      if (!listingImage || getSelectedPlatforms().length === 0) return;
      const isVIP = localStorage.getItem('xiuxiutu_vip') === 'true';
      if (!isVIP) {
        let count = parseInt(localStorage.getItem('xiuxiutu_exportCount') || '0');
        count++;
        localStorage.setItem('xiuxiutu_exportCount', count);
        if (count >= 5) { document.getElementById('vipOverlay').classList.add('show'); return; }
      }
      const zip = new JSZip();
      const mode = getListingMode();
      const platforms = getSelectedPlatforms();
      platforms.forEach(pKey => {
        const platform = PLATFORM_SIZES[pKey];
        if (!platform) return;
        const folder = zip.folder(platform.name);
        platform.sizes.forEach(size => {
          const canvas = generateSizeCanvas(listingImage, size, mode);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
          const base64 = dataUrl.split(',')[1];
          const filename = `${size.label}_${size.w}×${canvas.height}.jpg`;
          folder.file(filename, base64, { base64: true });
        });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '修修图_全平台图片包.zip';
      a.click();
      URL.revokeObjectURL(url);
    });

    function generateSizeCanvas(img, size, mode) {
      const canvas = document.createElement('canvas');
      let w = size.w, h = size.h;
      if (h === 0) h = Math.round(w / (img.naturalWidth / img.naturalHeight));
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      const useWhiteBg = (size.whiteBg || mode === 'whiteBg');
      if (useWhiteBg) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
        const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
        const dx = (w - dw) / 2, dy = (h - dh) / 2;
        ctx.drawImage(img, dx, dy, dw, dh);
      } else {
        ctx.drawImage(img, 0, 0, w, h);
      }
      return canvas;
    }

    updateListingExportBtn();

    console.log('✅ 修修图 · 电商工作台 大双栏终极版已加载！');
  </script>
</body>
</html>
